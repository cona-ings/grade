  get: async (key) => {
    const v = localStorage.getItem('gradeledger:' + key);
    return v != null ? { key, value: v, shared: false } : null;
  },
  set: async (key, value) => {
    localStorage.setItem('gradeledger:' + key, value);
    return { key, value, shared: false };
  },
  delete: async (key) => {
    localStorage.removeItem('gradeledger:' + key);
    return { key, deleted: true, shared: false };
  },
  list: async (prefix) => {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith('gradeledger:' + (prefix || ''))) keys.push(k.replace('gradeledger:', ''));
    }
    return { keys, shared: false };
  },
};

// 入社日から(退職日があればそこまで、なければ今日まで)の社歴を「○年○か月」で表す
function tenureMonths(joinDate, endDate) {
  if (!joinDate) return null;
  const [y, m, d] = joinDate.split('-').map(Number);
  if (!y || !m) return null;
  const end = endDate ? new Date(endDate) : new Date();
  let months = (end.getFullYear() - y) * 12 + (end.getMonth() + 1 - m);
  if (end.getDate() < (d || 1)) months -= 1;
  return Math.max(0, months);
}
function tenureLabel(joinDate, endDate) {
  const total = tenureMonths(joinDate, endDate);
  if (total == null) return '—';
  const y = Math.floor(total / 12);
  const m = total % 12;
  if (y === 0) return `${m}ヶ月`;
  if (m === 0) return `${y}年`;
  return `${y}年${m}ヶ月`;
}
// 退職済みなら退職日、そうでなければ今日を社歴の終点として使う
function tenureEndFor(emp) {
  return emp.resignDate || undefined;
}

const TENURE_BUCKETS = ['3ヶ月以内', '半年以内', '1-3年以内', '3年以上'];
function tenureBucket(joinDate, endDate) {
  const mo = tenureMonths(joinDate, endDate);
  if (mo == null) return null;
  if (mo <= 3) return '3ヶ月以内';
  if (mo <= 6) return '半年以内';
  if (mo >= 12 && mo <= 36) return '1-3年以内';
  if (mo > 36) return '3年以上';
  return null;
}

// 店舗の並び順=取り込んだデータ内で最初に登場した順(=元Excelの行順)を保持する
// 兼任などで「船橋・柏」のように複数店舗が入っている場合、それぞれの店舗名に分割する
function storeNames(store) {
  if (!store) return [];
  return store.split(/[、,・\/／]/).map((s) => s.trim()).filter(Boolean);
}

function storeAppearanceOrder(roster) {
  const seen = [];
  const seenSet = new Set();
  roster.forEach((r) => {
    storeNames(r.store).forEach((s) => { if (!seenSet.has(s)) { seenSet.add(s); seen.push(s); } });
  });
  return seen;
}

// 2026年9月から4ヶ月評価制。以前の評価区分はそのまま保存する。
function quarterOrdinal(dateStr) {
  const [ys,ms]=dateStr.split('-');const y=Number(ys), m=Number(ms);
  if (y>2026 || (y===2026 && m>=9)) {
    const elapsed=(y-2026)*12+m-9;
    return 2026*4+3+Math.floor(elapsed/4);
  }
  let idx, groupYear=y;
  if (m>=3 && m<=5) idx=1;
  else if (m>=6 && m<=8) idx=2;
  else if (m>=9 && m<=11) idx=3;
  else if(m===12) idx=4;
  else {idx=4;groupYear=y-1;}
  return groupYear*4+idx;
}
function ordinalToInfo(ordinal) {
  const firstNew=2026*4+3;
  if(ordinal>=firstNew){
    const i=ordinal-firstNew;
    const startMonthIndex=2026*12+8+i*4;
    const sy=Math.floor(startMonthIndex/12), sm=startMonthIndex%12+1;
    const endMonthIndex=startMonthIndex+3;
    const ey=Math.floor(endMonthIndex/12), em=endMonthIndex%12+1;
    return {sortDate:`${sy}-${String(sm).padStart(2,'0')}-01`,label:`${sy}年 ${sm}-${em}月`};
  }
  const groupYear=Math.floor((ordinal-1)/4);
  const idx=ordinal-groupYear*4;
  const qText=['','3-5月','6-8月','9-11月','12-2月'][idx];
  const sortMonth=['','03','06','09','12'][idx];
  const labelYear=idx===4?groupYear+1:groupYear;
  return {sortDate:`${groupYear}-${sortMonth}-01`,label:`${labelYear}年 ${qText}`};
}

// 実際の異動イベントに加え、変動がなかった四半期も「停滞」として補完したフル履歴を生成
function buildFullTimeline(emp) {
  const allEvents = (emp.history || []).filter((h) => h.date).slice().sort((a, b) => a.date.localeCompare(b.date));
  if (allEvents.length === 0) return [];

  // 2024年12月(データ収集開始)より前の履歴は表示しない。その時点の役職だけ起点として引き継ぐ
  let baselineGrade = null;
  const events = [];
  allEvents.forEach((e) => {
    if (e.date < '2024-12-01') { if (e.toGrade) baselineGrade = e.toGrade; }
    else events.push(e);
  });
  if (events.length === 0 && baselineGrade == null) return [];

  const eventsByOrdinal = new Map();
  events.forEach((e) => {
    const ord = quarterOrdinal(e.date);
    if (!eventsByOrdinal.has(ord)) eventsByOrdinal.set(ord, []);
    eventsByOrdinal.get(ord).push(e);
  });

  const startOrd = baselineGrade != null ? DATA_START_ORDINAL : quarterOrdinal(events[0].date);
  const endOrd = quarterOrdinal(todayStr());
  const timeline = [];
  let currentGrade = baselineGrade;
  for (let ord = startOrd; ord <= endOrd; ord++) {
    const acts = eventsByOrdinal.get(ord);
    if (acts && acts.length) {
      acts.forEach((a) => { const info=ordinalToInfo(ord); timeline.push({ ...a, quarterLabel: info.label, synthetic: false }); if (a.toGrade) currentGrade = a.toGrade; });
    } else if (ord === startOrd && baselineGrade != null) {
      const info = ordinalToInfo(ord);
      timeline.push({
        id: `datastart_${emp.id}`,
        date: info.sortDate,
        fromGrade: null,
        toGrade: baselineGrade,
        reason: '',
        quarterLabel: info.label,
        dataStart: true,
      });
    } else if (currentGrade) {
      const info = ordinalToInfo(ord);
      timeline.push({
        id: `synthetic_${emp.id}_${ord}`,
        date: info.sortDate,
        fromGrade: currentGrade,
        toGrade: currentGrade,
        reason: '',
        quarterLabel: info.label,
        synthetic: true,
      });
    }
  }
  return timeline;
}

// 特定の四半期(ordinal)時点での役職を、履歴から逆算する(Excel再エクスポート用)
function gradeAtOrdinal(emp, ord) {
  const events = (emp.history || []).filter((h) => h.date && h.toGrade).slice().sort((a, b) => a.date.localeCompare(b.date));
  if (events.length === 0) return '';
  const startOrd = quarterOrdinal(events[0].date);
  if (ord < startOrd) return '/';
  let val = events[0].toGrade;
  for (const e of events) {
    if (quarterOrdinal(e.date) <= ord) val = e.toGrade; else break;
  }
  return val;
}

function exportToExcel(roster) {
  const qOrdinals = QDATES.map((d) => quarterOrdinal(d));
  const rows = [
    Array(EXPORT_HEADERS.length + 1).fill(''),
    Array(EXPORT_HEADERS.length + 1).fill(''),

    const quarterCells = qOrdinals.map((ord) => gradeAtOrdinal(emp, ord));

      '', emp.name, emp.employmentType || '', '在籍中', emp.area || '', emp.businessType || '',
      emp.store || '', emp.joinDate || '', emp.employmentForm || '', emp.alert || '',

    ]);
  });
  const ws = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '教育データ');

// 最後に役職が変わった(初回配属含む・店舗異動のみは除く)四半期を求める
function lastGradeChangeOrdinal(emp) {
  const relevant = (emp.history || []).filter((h) => h.date && !h.noteOnly && (h.fromGrade == null || h.fromGrade !== h.toGrade));
  if (relevant.length === 0) return null;
  const last = relevant.reduce((a, b) => (a.date > b.date ? a : b));
  return quarterOrdinal(last.date);
}

// データ収集の開始四半期(2024年12月〜)。ずっと昇格していない人はここを起点に数える
const DATA_START_ORDINAL = quarterOrdinal('2024-12-01');

// 最後の役職変更から何期(四半期)経過しているかを、データ開始(2024年12月)を下限に正確に数える
function stagnationPeriods(emp) {
  const todayOrd = quarterOrdinal(todayStr());
  const maxPeriods = todayOrd - DATA_START_ORDINAL;
  let lastOrd = lastGradeChangeOrdinal(emp);
  if (lastOrd == null || lastOrd < DATA_START_ORDINAL) lastOrd = DATA_START_ORDINAL;
  return Math.min(todayOrd - lastOrd, maxPeriods);
}

// 店長以外で、2期以上昇格していない人を停滞者とみなす
function isStagnant(emp) {
  if (!emp.grade || emp.grade.startsWith('店長') || emp.grade.startsWith('エリアマネジャー')) return false;
  return stagnationPeriods(emp) >= 2;
}


function parseDateLoose(v) {
  if (v == null) return null;
  const s = String(v).trim();
  if (!s) return null;
  const m = s.match(/(\d{4})[\/\-年](\d{1,2})[\/\-月](\d{1,2})/);
  if (m) {
    const [, y, mo, d] = m;
    return `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  }
  const d2 = new Date(s);
  if (!isNaN(d2.getTime())) return d2.toISOString().slice(0, 10);
  return null;
}

function cleanCell(v) {
  if (v == null) return null;
  const s = String(v).trim();
  if (s === '' || s === '/') return null;
  return s;
}

// Parse rows exported in the "Excelヘッダーをそのままキーにした" JSON format
// (name-based columns: 氏名, エリア, 業態, 店舗, 雇用形態, 形態, 日, アラート, 異動履歴, 備考, and the 9 quarter columns)

function parseImportRows(rows) {
  const employees = [];
  const errors = [];
  rows.forEach((row, i) => {
    const name = cleanCell(row['氏名']);
    if (!name) return;
    const joinDate = parseDateLoose(row['日']);

    const history = [];
    let lastGrade = null;
    QCOLS.forEach((col, qi) => {
      let raw = cleanCell(row[col]);
      if (raw != null && AM_CODE_MAP[raw]) raw = AM_CODE_MAP[raw];
      if (raw == null || !GRADES.includes(raw)) return;
      if (lastGrade == null) {
        history.push({
          id: `h${Date.now()}_${i}_${qi}`,
          date: joinDate || QDATES[qi],
          fromGrade: null,
          toGrade: raw,
          reason: '初期配属',
          quarterLabel: QLABELS[qi],
        });
        lastGrade = raw;
      } else if (raw !== lastGrade) {
        history.push({
          id: `h${Date.now()}_${i}_${qi}b`,
          date: QDATES[qi],
          fromGrade: lastGrade,
          toGrade: raw,
          reason: '四半期評価',
          quarterLabel: QLABELS[qi],
        });
        lastGrade = raw;
      }
    });

    const rawNotes = cleanCell(row['異動履歴']);
    const notesParts = [rawNotes, cleanCell(row['備考'])].filter(Boolean);
    const rawWorkStatus = cleanCell(row['勤務状況']);
    const workStatus = rawWorkStatus == null ? '通常'
      : rawWorkStatus.includes('休職') ? '休職'
      : rawWorkStatus.includes('時短') ? '時短'
      : rawWorkStatus.includes('退職') ? '退職'
      : '通常';

    employees.push({
      id: `e${Date.now()}_${i}`,
      name,
      area: cleanCell(row['エリア']) || '',
      businessType: cleanCell(row['業態']) || '',
      store: cleanCell(row['店舗']) || '',

// 役職ごとに色分け:一般=紺、チーフ=緑、副店長=黄、店長=赤(層内は濃淡)
function relLuminance(hex) {
  const { r, g, b } = hexToRgb(hex);
  const [R, G, B] = [r, g, b].map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
  return 0.2126 * R + 0.7152 * G + 0.0722 * B;
}
function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}
function hexToRgba(hex, alpha) {
  const { r, g, b } = hexToRgb(hex);
  return `rgba(${r},${g},${b},${alpha})`;
}
function textColorFor(hex) {
  return relLuminance(hex) > 0.55 ? '#1C2B39' : '#fff';
}
const GRADE_COLORS = {
  '一般D': '#9DB4CC', '一般C': '#84A0C0', '一般B': '#6C8CB3', '一般A': '#53789F',
  'チーフC': '#DEF5C7', 'チーフB': '#C9EDA3', 'チーフA': '#B2E47D',
  '副店長B': '#FFEDB2', '副店長A': '#FFDF73', '副店長': '#FFD24D',
  '店長代理': '#FFC3B3', '店長C': '#FF9B9B', '店長B': '#FF6B6B', '店長A': '#FF3D3D', '店長S': '#B71C1C',
  'エリアマネジャーC': '#C5A6E8', 'エリアマネジャーB': '#A87FDB', 'エリアマネジャーA': '#8B5CC7', 'エリアマネジャーS': '#5B2C91',
};

function Seal({ code, size = 44 }) {
  const label = gradeLabel(code);
  const short = sealText(code);
  const isUnknown = !code;
  const fontSize = short.length >= 4 ? size * 0.21 : size * 0.27;
  const bg = isUnknown ? 'transparent' : GRADE_COLORS[code] || C.seal;
  const isTop = code === GRADES[GRADES.length - 1];
  return (
    <div
      className="gl-mincho"
      style={{
        width: size,
        height: size,
        borderRadius: '9999px',
        border: isUnknown ? `2px dashed ${C.muted}` : isTop ? `2px solid #E8C25A` : `2px solid rgba(0,0,0,0.12)`,
        boxShadow: isTop ? '0 0 0 2px rgba(232,194,90,0.35)' : 'none',
        color: isUnknown ? C.muted : textColorFor(bg),
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'center',
        transform: isUnknown ? 'none' : 'rotate(-4deg)',
        lineHeight: 1.1,
        flexShrink: 0,
        textAlign: 'center',
        background: isUnknown ? 'transparent' : bg,
        padding: 2,
        boxSizing: 'border-box',
      }}
      title={label}
    >
      <span style={{ fontSize, fontWeight: 700 }}>{isUnknown ? '－' : short}</span>
    </div>
  );
}

function MoveIcon({ from, to, rename }) {
  if (from == null || rename) return <Minus size={16} color={C.muted} />;
  const diff = gradeIdx(to) - gradeIdx(from);
  if (diff > 0) return <ArrowUp size={16} color={C.up} />;
  if (diff < 0) return <ArrowDown size={16} color={C.down} />;
  return <Minus size={16} color={C.muted} />;
}

const inputStyle = {
  width: '100%',
  height: 36,
  padding: '8px 10px',
  border: `1px solid ${C.line}`,
  borderRadius: 5,
  fontSize: 13,
  color: C.ink,
  boxSizing: 'border-box',
  background: '#fff',
};

function Field({ label, children }) {
  return (
    <div style={{ marginBottom: 14 }}>
      <label style={{ display: 'block', fontSize: 12, color: C.muted, marginBottom: 5 }}>{label}</label>
      {children}
    </div>
  );
}

function GradeSelect({ value, onChange }) {
  return (
    <select value={value} onChange={(e) => onChange(e.target.value)} style={inputStyle}>
      {GRADE_GROUPS.map((grp) => (
        <optgroup key={grp.label} label={grp.label}>
          {grp.codes.map((c) => (<option key={c} value={c}>{c}</option>))}
        </optgroup>
      ))}
    </select>
  );
}

          if (Array.isArray(data) && data.length > 0) {
            setRoster(data);
            try { await window.storage.set('roster', JSON.stringify(data), false); } catch (e) { /* ignore */ }
            setLoaded(true);
            return;
          }
        }
      } catch (e) {
        // roster.json が無い/読み込めない場合はこれまで通りの動作にフォールバック
      }
      try {
        // ブラウザに前回保存されたデータ(localStorage)が、今回埋め込まれているSEED_DATAと
        // 同じバージョンの時だけ使う。SEED_DATAを更新してSEED_VERSIONを変えれば、
        // 古いキャッシュより必ず新しいSEED_DATAが優先される
        const verRes = await window.storage.get('seedVersion', false);
        const storedVersion = verRes && verRes.value;
        if (storedVersion === SEED_VERSION) {
          const res = await window.storage.get('roster', false);
          if (res && res.value) {
            setRoster(JSON.parse(res.value));
            setLoaded(true);
            return;
          }
        }
        setRoster(SEED_DATA);
        await window.storage.set('roster', JSON.stringify(SEED_DATA), false);
        await window.storage.set('seedVersion', SEED_VERSION, false);
      } catch (e) {
        setRoster(SEED_DATA);
      } finally {
        setLoaded(true);
      }
    })();
  }, []);

  const persist = async (next) => {
    setRoster(next);
    setSaving(true);
    try {
      await window.storage.set('roster', JSON.stringify(next), false);
    } catch (e) {
      console.error('保存に失敗しました', e);
    } finally {
      setSaving(false);
    }
  };

  const stores = useMemo(() => {
    return ['すべて', ...storeAppearanceOrder(roster)];
  }, [roster]);

  const areas = useMemo(() => {
    const set = new Set(roster.map((r) => r.area).filter(Boolean));
    return ['すべて', ...Array.from(set).sort((a, b) => a.localeCompare(b, 'ja'))];
  }, [roster]);

  const activeRoster = useMemo(() => roster.filter((r) => (r.workStatus || '通常') !== '退職'), [roster]);

  const stagnantCount = useMemo(() => activeRoster.filter(isStagnant).length, [activeRoster]);

  const [sortKey, setSortKey] = useState('grade'); // 'grade' | 'store' | 'area' | 'tenure'
  const [viewMode, setViewMode] = useState('list'); // 'list' | 'org'
  const [sortDir, setSortDir] = useState('desc'); // 'asc' | 'desc'

  const toggleSort = (key) => {
    if (sortKey === key) setSortDir(sortDir === 'asc' ? 'desc' : 'asc');
    else { setSortKey(key); setSortDir('asc'); }
  };

  const filtered = useMemo(() => {
    const cmp = (a, b) => {
      let c = 0;
      if (sortKey === 'grade') c = gradeIdx(a.grade) - gradeIdx(b.grade);
      else if (sortKey === 'store') c = (a.store || '').localeCompare(b.store || '', 'ja');
      else if (sortKey === 'area') c = (a.area || '').localeCompare(b.area || '', 'ja');
      else if (sortKey === 'tenure') c = (tenureMonths(a.joinDate, tenureEndFor(a)) ?? -1) - (tenureMonths(b.joinDate, tenureEndFor(b)) ?? -1);
      if (c === 0) c = a.name.localeCompare(b.name, 'ja');
      return sortDir === 'asc' ? c : -c;
    };
    return roster
      .filter((r) => (storeFilter === 'すべて' ? true : storeNames(r.store).includes(storeFilter)))
      .filter((r) => (areaFilter === 'すべて' ? true : r.area === areaFilter))
      .filter((r) => (tenureFilter === 'すべて' ? true : tenureBucket(r.joinDate, tenureEndFor(r)) === tenureFilter))
      .filter((r) => (employmentTypeFilter === 'すべて' ? true : r.employmentType === employmentTypeFilter))
      .filter((r) => {
        const ws = r.workStatus || '通常';
        if (workStatusFilter === 'すべて') return ws !== '退職';
        return ws === workStatusFilter;
      })
      .filter((r) => (stagnantOnly ? isStagnant(r) : true))
      .filter((r) => {
        const q = search.trim();
        if (!q) return true;
        return r.name.includes(q) || (r.store || '').includes(q) || (r.area || '').includes(q);
      })
      .sort(cmp);
  }, [roster, search, storeFilter, areaFilter, tenureFilter, employmentTypeFilter, workStatusFilter, stagnantOnly, sortKey, sortDir]);

  // 勤務状況・停滞条件を除いた同条件の母集団(店舗・エリア・社歴・雇用形態・検索語のみ)。ここに対する割合を「該当率」として表示する
  const segmentBase = useMemo(() => {
    return roster
      .filter((r) => (storeFilter === 'すべて' ? true : storeNames(r.store).includes(storeFilter)))
      .filter((r) => (areaFilter === 'すべて' ? true : r.area === areaFilter))
      .filter((r) => (tenureFilter === 'すべて' ? true : tenureBucket(r.joinDate, tenureEndFor(r)) === tenureFilter))
      .filter((r) => (employmentTypeFilter === 'すべて' ? true : r.employmentType === employmentTypeFilter))
      .filter((r) => {
        const q = search.trim();
        if (!q) return true;
        return r.name.includes(q) || (r.store || '').includes(q) || (r.area || '').includes(q);
      });
  }, [roster, search, storeFilter, areaFilter, tenureFilter]);

  const segmentPercent = segmentBase.length > 0 ? Math.round((filtered.length / segmentBase.length) * 1000) / 10 : null;
  const showSegmentStat = tenureFilter !== 'すべて' || workStatusFilter !== 'すべて' || employmentTypeFilter !== 'すべて';

  const gradeCounts = useMemo(() => {
    const m = {};
    GRADES.forEach((g) => (m[g] = 0));
    let unrated = 0;
    activeRoster.forEach((r) => { if (r.grade) m[r.grade] = (m[r.grade] || 0) + 1; else unrated++; });
    return { m, unrated };
  }, [activeRoster]);

  const selected = roster.find((r) => r.id === selectedId) || null;

  const addEmployee = (form) => {
    const id = `e${Date.now()}_${idRef.current++}`;
    const entry = {
      id: `h${Date.now()}_${idRef.current++}`,
      date: form.joinDate || todayStr(),
      fromGrade: null,
      toGrade: form.grade,
      reason: '初期配属',
    };
    const emp = { id, name: form.name, area: form.area, businessType: form.businessType, store: form.store,
      employmentType: form.employmentType, joinDate: form.joinDate,
      alert: '', notes: '', grade: form.grade, history: [entry] };
    persist([...roster, emp]);
    setShowAdd(false);
  };

  const recordMove = (empId, form) => {
    const entry = {
      id: `h${Date.now()}_${idRef.current++}`,
      date: form.date || todayStr(),
      fromGrade: form.fromGrade,
      toGrade: form.toGrade,
      reason: form.reason || '',
      ...(form.toStore != null ? { fromStore: form.fromStore, toStore: form.toStore } : {}),
    };
    const next = roster.map((r) => r.id === empId
      ? { ...r, grade: form.toGrade, store: form.toStore != null ? form.toStore : r.store, history: [...r.history, entry] }
      : r);
    persist(next);
  };

  const updateProfile = (empId, patch) => {
    const next = roster.map((r) => r.id === empId ? { ...r, ...patch } : r);
    persist(next);
  };

  const deleteEmployee = (id) => {
    persist(roster.filter((r) => r.id !== id));
    setConfirmDeleteId(null);
    if (selectedId === id) setSelectedId(null);
  };

  const clearAll = () => {
    persist([]);
    setSelectedId(null);
    setConfirmClearAll(false);
  };

  const importEmployees = (newEmployees) => {
    // 既存データは全て消去し、インポートしたデータで完全に入れ替える
    persist(newEmployees);
    setShowImport(false);
  };

  if (!loaded) {
    return (
      <div className="gl-sans" style={{ background: C.paper, minHeight: 480, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        <style>{FONTS}</style>
        <Loader2 className="animate-spin" color={C.muted} size={28} />
      </div>
    );
  }

  return (
    <div className="gl-sans" style={{ background: C.paper, minHeight: 480, padding: 0 }}>
      <style>{FONTS}</style>
      <div style={{ maxWidth: 1040, margin: '0 auto', padding: '28px 20px 60px' }}>
        <Header
          saving={saving}
          onImport={() => setShowImport(true)} onExport={() => exportToExcel(roster)}
          onExportJSON={() => downloadRosterJSON(roster)}
          onExportHTML={exportCurrentViewHTML} onExportPDF={exportCurrentViewPDF}
          confirmClearAll={confirmClearAll} setConfirmClearAll={setConfirmClearAll} onClearAll={clearAll}
          hasData={roster.length > 0}
        />

        {!selected && (
          <>
            <div style={{ display: 'flex', alignItems: 'stretch', background: C.card, border: `1px solid ${C.line}`, borderRadius: 6, padding: '3px 5px 0', marginBottom: 18, width: 'fit-content' }}>
              {[['list', '昇降格'], ['org', '組織図'], ['turnover', '離職率'], ['late', '遅刻']].map(([key, label], index) => (
                <React.Fragment key={key}>
                  {index > 0 && <span aria-hidden="true" style={{ width: 1, height: 18, background: C.line, opacity: 0.7, alignSelf: 'center' }} />}
                  <button
                    onClick={() => setViewMode(key)}
                    style={{
                      position: 'relative', fontSize: 13, padding: '7px 18px 9px', border: 'none', cursor: 'pointer', fontWeight: viewMode === key ? 700 : 500,
                      background: 'transparent', color: viewMode === key ? C.ink : C.inkSoft,
                    }}
                  >
                    {label}
                    {viewMode === key && <span aria-hidden="true" style={{ position: 'absolute', left: 14, right: 14, bottom: 0, height: 2, borderRadius: 2, background: C.ink }} />}
                  </button>
                </React.Fragment>
              ))}
            </div>

            {viewMode === 'list' ? (
              <>
                <div className="gl-mincho" style={{ fontSize: 22, fontWeight: 700, color: C.ink, marginBottom: 16 }}>昇降格管理台帳</div>
                <GradeBar counts={gradeCounts.m} unrated={gradeCounts.unrated} total={activeRoster.length} />
                <Toolbar
                  search={search} setSearch={setSearch}
                  storeFilter={storeFilter} setStoreFilter={setStoreFilter} stores={stores}
                  areaFilter={areaFilter} setAreaFilter={setAreaFilter} areas={areas}
                  tenureFilter={tenureFilter} setTenureFilter={setTenureFilter}
                  employmentTypeFilter={employmentTypeFilter} setEmploymentTypeFilter={setEmploymentTypeFilter}
                  workStatusFilter={workStatusFilter} setWorkStatusFilter={setWorkStatusFilter}
                  stagnantOnly={stagnantOnly} setStagnantOnly={setStagnantOnly} stagnantCount={stagnantCount}
                  visibleCols={visibleCols} setVisibleCols={setVisibleCols}
                  onAdd={() => setShowAdd(true)}
                />
                {showSegmentStat && (
                  <div style={{ fontSize: 12, color: C.inkSoft, marginBottom: 10, display: 'flex', alignItems: 'center', gap: 6 }}>
                    <span className="gl-mincho" style={{ fontWeight: 700, color: C.ink, fontSize: 14 }}>{filtered.length}名</span>
                    該当（この条件の母集団 {segmentBase.length}名中
                    <span className="gl-mincho" style={{ fontWeight: 700, color: C.seal }}>{segmentPercent}%</span>）
                  </div>
                )}
                {filtered.length === 0 ? (
                  <EmptyState hasAny={roster.length > 0} onAdd={() => setShowAdd(true)} />
                ) : (
                  <RosterTable
                    rows={filtered} onSelect={setSelectedId}
                    confirmDeleteId={confirmDeleteId} setConfirmDeleteId={setConfirmDeleteId} onDelete={deleteEmployee}
                    sortKey={sortKey} sortDir={sortDir} onToggleSort={toggleSort}
                    visibleCols={visibleCols}
                  />
                )}
              </>
            ) : viewMode === 'org' ? (
              <OrgChart roster={activeRoster} onSelect={setSelectedId} />
            ) : viewMode === 'turnover' ? (
              <TurnoverDashboard />
            ) : (
              <LateDashboard />
            )}
          </>
        )}

        {selected && (
          <DetailView
            emp={selected}
            onBack={() => setSelectedId(null)}
            onRecordMove={(form) => recordMove(selected.id, form)}
            onUpdateProfile={(patch) => updateProfile(selected.id, patch)}
          />
        )}
      </div>

      {showAdd && <AddModal onClose={() => setShowAdd(false)} onSubmit={addEmployee} />}
      {showImport && <ImportModal onClose={() => setShowImport(false)} onImport={importEmployees} />}
    </div>
  );
}

function Header({ saving, onImport, onExport, onExportJSON, onExportHTML, onExportPDF, confirmClearAll, setConfirmClearAll, onClearAll, hasData }) {
  const [downloadOpen, setDownloadOpen] = useState(false);
  const downloadMenuRef = useRef(null);

  useEffect(() => {
    if (!downloadOpen) return;
    const closeOnOutside = (e) => {
      if (downloadMenuRef.current && !downloadMenuRef.current.contains(e.target)) setDownloadOpen(false);
    };
    const closeOnEscape = (e) => { if (e.key === 'Escape') setDownloadOpen(false); };
    document.addEventListener('mousedown', closeOnOutside);
    document.addEventListener('touchstart', closeOnOutside);
    document.addEventListener('keydown', closeOnEscape);
    return () => {
      document.removeEventListener('mousedown', closeOnOutside);
      document.removeEventListener('touchstart', closeOnOutside);
      document.removeEventListener('keydown', closeOnEscape);
    };
  }, [downloadOpen]);

  const runDownload = (action) => {
    setDownloadOpen(false);
    action();
  };

  const actionButtonStyle = { height: 36, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7, padding: '0 12px', background: '#fff', color: C.ink, border: `1px solid #b9d6e8`, borderRadius: 7, fontSize: 13, cursor: 'pointer', fontWeight: 700, whiteSpace: 'nowrap', boxSizing: 'border-box' };

  return (
    <div style={{ borderBottom: `2px solid ${C.ink}`, paddingBottom: 16, marginBottom: 20, display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', flexWrap: 'wrap', gap: 12 }}>
      <div>
        <div className="gl-mincho" style={{ fontSize: 12, letterSpacing: 4, color: C.muted, marginBottom: 4 }}>HUMAN RESOURCES DATA</div>
        <h1 className="gl-mincho" style={{ fontSize: 'clamp(24px, 7vw, 30px)', fontWeight: 700, color: C.ink, margin: 0, letterSpacing: 0, lineHeight: 1.3 }}><span style={{ whiteSpace: 'nowrap' }}>レストラン事業部 営業一課</span><br />人事関連データ</h1>
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 16, flexWrap: 'wrap' }}>
        {confirmClearAll ? (
          <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
            <span style={{ fontSize: 12, color: C.seal }}>本当に全データを消去しますか？</span>
            <button onClick={onClearAll} style={{ fontSize: 12, color: '#fff', background: C.seal, border: 'none', borderRadius: 4, padding: '6px 10px', cursor: 'pointer' }}>消去する</button>
            <button onClick={() => setConfirmClearAll(false)} style={{ fontSize: 12, color: C.muted, background: 'none', border: `1px solid ${C.line}`, borderRadius: 4, padding: '6px 10px', cursor: 'pointer' }}>取消</button>
          </div>
        ) : (
          <div className="export-hide" style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
            <button onClick={onImport} title="Excelから一括インポート" style={{ ...actionButtonStyle, minWidth: 128 }}>
              <Upload size={14} /> インポート
            </button>
            <div ref={downloadMenuRef} style={{ position: 'relative' }}>
              <button
                type="button"
                onClick={() => setDownloadOpen((v) => !v)}
                aria-haspopup="menu"
                aria-expanded={downloadOpen}
                style={{ ...actionButtonStyle, minWidth: 146 }}
              >
                <Download size={14} />
                <span>ダウンロード</span>
                <ChevronDown size={13} style={{ marginLeft: 1, transition: 'transform .15s', transform: downloadOpen ? 'rotate(180deg)' : 'none' }} />
              </button>
              {downloadOpen && (
                <div role="menu" style={{ position: 'absolute', top: 42, right: 0, width: 146, zIndex: 50, background: '#fff', border: `1px solid ${C.line}`, borderRadius: 7, boxShadow: '0 10px 28px rgba(31,59,77,.18)', padding: 5, boxSizing: 'border-box' }}>
                  {[
                    ['Excel', onExport],
                    ['JSON', onExportJSON],
                    ['HTML', onExportHTML],
                    ['PDF', onExportPDF],
                  ].map(([label, action]) => (
                    <button key={label} type="button" role="menuitem" onClick={() => runDownload(action)} style={{ width: '100%', padding: '10px 12px', background: '#fff', border: 'none', borderRadius: 5, color: C.ink, fontSize: 14, fontWeight: 600, textAlign: 'left', cursor: 'pointer' }} onMouseEnter={(e) => e.currentTarget.style.background = C.paper} onMouseLeave={(e) => e.currentTarget.style.background = '#fff'}>
                      {label}
                    </button>
                  ))}
                </div>
              )}
            </div>
            {hasData && (
              <button onClick={() => setConfirmClearAll(true)} title="全データを消去" style={{ display: 'flex', alignItems: 'center', gap: 5, padding: '7px 10px', background: '#fff', color: C.seal, border: `1px solid ${C.seal}`, borderRadius: 5, fontSize: 12, cursor: 'pointer', fontWeight: 500 }}>
                <Trash2 size={14} />
              </button>
            )}
          </div>
        )}
        <div style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 12, color: C.muted, minWidth: 70, justifyContent: 'flex-end' }}>
          {saving ? (<><Loader2 className="animate-spin" size={13} /> 保存中…</>) : '保存済み'}
        </div>
      </div>
    </div>
  );
}

const TIER_COLOR = { '店長': '#FF3D3D', '副店長': '#FFDF73', 'チーフ': '#B2E47D', '一般': '#6C8CB3' };

function tierOf(grade) {
  const g = GRADE_GROUPS.find((grp) => grp.codes.includes(grade));
  return g ? g.label : null;
}

function GradeBar({ counts, unrated, total }) {
  const max = Math.max(1, ...Object.values(counts));

  return (
    <div style={{ background: C.card, border: '2px solid #73809a', borderRadius: 6, padding: '16px 20px', marginBottom: 18 }}>
      <div style={{ fontSize: 13, color: C.inkSoft, display: 'flex', alignItems: 'center', gap: 6, marginBottom: 12 }}>
        <Users size={14} /> 役職分布（在籍 {total} 名{unrated ? `・未評価 ${unrated} 名` : ''}）
      </div>
      <div style={{ width: '100%', overflowX: 'auto' }}>
        <div style={{ display: 'flex', gap: 20, minWidth: 620 }}>
          {[...GRADE_GROUPS].reverse().map((grp) => (
            <div key={grp.label} style={{ display: 'flex', gap: 10 }}>
              <div style={{ borderLeft: `2px solid ${C.line}`, paddingLeft: 10, display: 'flex', flexDirection: 'column' }}>
                <div style={{ fontSize: 11, color: C.muted, marginBottom: 8 }}>{grp.label}</div>
                <div style={{ display: 'flex', gap: 10 }}>
                  {[...grp.codes].reverse().map((code) => (
                    <div key={code} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', minWidth: 34 }}>
                      <div style={{ position: 'relative', width: 22, height: 56, background: C.paper, borderRadius: 3, display: 'flex', alignItems: 'flex-end', overflow: 'hidden', border: `1px solid ${C.line}` }}>
                        <div style={{ width: '100%', height: `${(counts[code] / max) * 100}%`, background: GRADE_COLORS[code], opacity: 0.85 }} />
                      </div>
                      <div className="gl-mincho" style={{ fontSize: 12, fontWeight: 700, color: C.ink, marginTop: 6 }}>{counts[code]}</div>
                      <div style={{ fontSize: 9, color: C.muted }}>{code === grp.label || code === '店長代理' ? code : code.replace(grp.label, '')}</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function Toolbar({ search, setSearch, storeFilter, setStoreFilter, stores, areaFilter, setAreaFilter, areas, tenureFilter, setTenureFilter, employmentTypeFilter, setEmploymentTypeFilter, workStatusFilter, setWorkStatusFilter, stagnantOnly, setStagnantOnly, stagnantCount, visibleCols, setVisibleCols, onAdd }) {
  return (
    <div style={{ display: 'flex', gap: 10, marginBottom: 14, flexWrap: 'wrap', alignItems: 'center' }}>
      <div style={{ position: 'relative', flex: '1 1 220px', minWidth: 0 }}>
        <span aria-hidden="true" style={{ position: 'absolute', left: 10, top: '50%', transform: 'translateY(-50%)', fontSize: 14, lineHeight: 1, color: C.muted, pointerEvents: 'none', zIndex: 1 }}>⌕</span>
        <input
          value={search} onChange={(e) => setSearch(e.target.value)} placeholder="氏名・店舗・エリアで検索"
          style={{ ...inputStyle, width: '100%', paddingLeft: 32 }}
        />
      </div>
      <select value={areaFilter} onChange={(e) => setAreaFilter(e.target.value)} style={{ ...inputStyle, width: 'auto' }}>
        {areas.map((d) => (<option key={d} value={d}>{d === 'すべて' ? 'エリア：全て' : d}</option>))}
      </select>
      <select value={storeFilter} onChange={(e) => setStoreFilter(e.target.value)} style={{ ...inputStyle, width: 'auto' }}>
        {stores.map((d) => (<option key={d} value={d}>{d === 'すべて' ? '店舗：全て' : d}</option>))}
      </select>
      <select value={tenureFilter} onChange={(e) => setTenureFilter(e.target.value)} style={{ ...inputStyle, width: 'auto' }}>
        <option value="すべて">社歴：全て</option>
        {TENURE_BUCKETS.map((b) => (<option key={b} value={b}>{b}</option>))}
      </select>
      <select value={employmentTypeFilter} onChange={(e) => setEmploymentTypeFilter(e.target.value)} style={{ ...inputStyle, width: 'auto' }}>
        <option value="すべて">雇用形態：全て</option>
        {EMPLOYMENT_TYPES.map((t) => (<option key={t} value={t}>{empTypeLabel(t)}</option>))}
      </select>
      <select
        value={workStatusFilter}
        onChange={(e) => setWorkStatusFilter(e.target.value)}
        style={{ ...inputStyle, width: 'auto', color: workStatusFilter === '退職' ? '#E53935' : C.ink }}
        title="退職者は通常は一覧から除外されます。ここで「退職」を選ぶと検索できます"
      >
        <option value="すべて">勤務状況：全て（退職を除く)</option>
        {WORK_STATUS_OPTIONS.map((s) => (<option key={s} value={s}>{s}</option>))}
      </select>
      <button
        onClick={() => setStagnantOnly(!stagnantOnly)}
        style={{
          display: 'flex', alignItems: 'center', gap: 6, padding: '8px 16px', borderRadius: 5, fontSize: 13, cursor: 'pointer', fontWeight: 500,
          background: stagnantOnly ? C.seal : '#fff', color: stagnantOnly ? '#fff' : C.seal, border: `1px solid ${C.seal}`,
        }}
        title="店長を除き、2期以上昇格していない社員を抽出"
      >
        停滞者を抽出（{stagnantCount}名）
      </button>
      <ColumnToggle visibleCols={visibleCols} setVisibleCols={setVisibleCols} />
      <button onClick={onAdd} style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '8px 16px', background: C.ink, color: '#fff', border: 'none', borderRadius: 5, fontSize: 13, cursor: 'pointer', fontWeight: 500 }}>
        <Plus size={15} /> 社員を追加
      </button>
    </div>
  );
}

function ColumnToggle({ visibleCols, setVisibleCols }) {
  const [open, setOpen] = useState(false);
  const toggle = (key) => setVisibleCols({ ...visibleCols, [key]: !visibleCols[key] });
  return (
    <div style={{ position: 'relative' }}>
      <button
        onClick={() => setOpen(!open)}
        style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '8px 16px', background: '#fff', color: C.inkSoft, border: `1px solid ${C.line}`, borderRadius: 5, fontSize: 13, cursor: 'pointer', fontWeight: 500, height: 36, boxSizing: 'border-box' }}
      >
        表示項目
      </button>

// エリア→店舗の列構成を、データ内での初出順で組み立てる(元シートのブロック構成に近づける)
function orgChartColumns(roster) {
  const areaOrder = [];
  const areaSeen = new Set();
  const storesByArea = new Map();
  roster.forEach((r) => {
    const names = storeNames(r.store);
    if (names.length === 0) return;
    const area = r.area || '未設定';
    if (!areaSeen.has(area)) { areaSeen.add(area); areaOrder.push(area); storesByArea.set(area, []); }
    const list = storesByArea.get(area);
    names.forEach((s) => { if (!list.includes(s)) list.push(s); });
  });
  return areaOrder.map((area) => ({ area, stores: storesByArea.get(area) }));
}

function OrgChart({ roster, onSelect }) {
  const groups = useMemo(() => orgChartColumns(roster), [roster]);
  const flatStores = useMemo(() => groups.flatMap((g) => g.stores), [groups]);

  const cellMap = useMemo(() => {
    const m = {};
    GRADES.forEach((g) => { m[g] = {}; });
    roster.forEach((r) => {
      if (!r.grade) return;
      storeNames(r.store).forEach((s) => {
        if (!m[r.grade][s]) m[r.grade][s] = [];
        m[r.grade][s].push(r);
      });
    });
    return m;
  }, [roster]);

  const storeTotals = useMemo(() => {
    const m = {};
    roster.forEach((r) => { storeNames(r.store).forEach((s) => { m[s] = (m[s] || 0) + 1; }); });
    return m;
  }, [roster]);

  const rowGrades = ['店長S', '店長A', '店長B', '店長C', '店長代理', '副店長', 'チーフA', 'チーフB', 'チーフC', '一般A', '一般B', '一般C']; // 最新階層・上位から下位

  }

  return (
    <div style={{ background: C.card, border: '2px solid #73809a', borderRadius: 6, overflow: 'hidden' }}>
      <div style={{ overflowX: 'auto' }}>
        <div style={{ minWidth: LABEL_W + flatStores.length * COL_W }}>
          {/* エリア見出し行 */}
          <div style={{ display: 'flex' }}>
            <div style={{ width: LABEL_W, flexShrink: 0, background: C.paper, borderRight: `1px solid ${C.line}`, borderBottom: `1px solid ${C.line}`, position: 'sticky', left: 0, zIndex: 3 }} />

              <div
                key={g.area}

                  color: '#fff', background: AREA_NAVY, borderRight: `1px solid rgba(255,255,255,0.25)`, borderBottom: `1px solid ${C.line}`, padding: '6px 1px',
                }}
              >{g.area}</div>
            ))}
          </div>
          {/* 店舗見出し行 */}
          <div style={{ display: 'flex' }}>
            <div style={{ width: LABEL_W, flexShrink: 0, background: C.paper, borderRight: `1px solid ${C.line}`, borderBottom: `2px solid ${C.ink}`, position: 'sticky', left: 0, zIndex: 3 }} />
            {flatStores.map((store, i) => (

                  background: STORE_NAVY, borderRight: `1px solid rgba(255,255,255,0.2)`, borderBottom: `2px solid ${C.ink}`, padding: '5px 1px', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
                }}

function ImportModal({ onClose, onImport }) {
  const [text, setText] = useState('');
  const [error, setError] = useState('');
  const [preview, setPreview] = useState(null);
  const [fileName, setFileName] = useState('');

  const runParseFromRows = (rows) => {
    setError('');
    setPreview(null);
    try {
      if (!Array.isArray(rows) || rows.length === 0) throw new Error('データが見つかりませんでした');
      const { employees } = parseImportRows(rows);
      if (employees.length === 0) throw new Error('取り込める行が見つかりませんでした。列見出しが「氏名」「エリア」「店舗」「日」「12-2月」等と一致しているか確認してください');
      setPreview(employees);
    } catch (e) {
      setError(e.message || '解析に失敗しました');
    }
  };

  const runParse = () => {
    try {
      const rows = JSON.parse(text);
      runParseFromRows(rows);
    } catch (e) {
      setError('JSONの形式を確認してください（' + (e.message || '') + '）');
    }
  };

  const handleFile = (file) => {
    setFileName(file.name);
    setError('');
    setPreview(null);
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const wb = XLSX.read(evt.target.result, { type: 'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        // 3行目(index 2)が見出し行、4行目(index 3)以降がデータという元シートの構成に合わせる
        const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: false });
        const headers = aoa[2] || [];
        const dataRows = aoa.slice(3);
        const rows = dataRows.map((row) => {
          const obj = {};
          headers.forEach((h, i) => {
            if (h) obj[h] = row[i] != null ? String(row[i]) : '';
          });
          return obj;
        }).filter((obj) => obj['氏名']);
        runParseFromRows(rows);
      } catch (e) {
        setError('Excelファイルの読み込みに失敗しました。シート構成(3行目が見出し)を確認してください');
      }
    };
    reader.readAsArrayBuffer(file);
  };

  return (
    <div style={{ position: 'fixed', inset: 0, background: 'rgba(28,43,57,0.45)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 50, padding: 16 }}>
      <div className="gl-sans" style={{ background: C.card, borderRadius: 8, width: '100%', maxWidth: 560, padding: 24, border: `1px solid ${C.line}`, maxHeight: '90vh', overflowY: 'auto' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
          <div className="gl-mincho" style={{ fontSize: 17, fontWeight: 700, color: C.ink }}>Excelから一括インポート</div>
          <button onClick={onClose} style={{ background: 'none', border: 'none', cursor: 'pointer', color: C.muted }}><X size={18} /></button>
        </div>
        <div style={{ fontSize: 12, color: C.muted, marginBottom: 10, lineHeight: 1.6 }}>
          元シートと同じ形式(.xlsx、3行目が見出し)のファイルをそのままアップロードできます。<span style={{ color: C.seal, fontWeight: 700 }}>インポートすると現在の台帳データは全て消去され、ここで読み込んだデータに完全に入れ替わります。</span>
        </div>

        <label
          style={{
            display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, height: 76, border: `1.5px dashed ${C.line}`, borderRadius: 6,
            color: C.inkSoft, fontSize: 13, cursor: 'pointer', marginBottom: 10, background: C.paper,
          }}
        >
          <Upload size={16} />
          {fileName ? fileName : 'Excelファイル(.xlsx)を選択'}
          <input type="file" accept=".xlsx,.xls" style={{ display: 'none' }} onChange={(e) => e.target.files[0] && handleFile(e.target.files[0])} />
        </label>

        <div style={{ fontSize: 11, color: C.muted, textAlign: 'center', margin: '4px 0 10px' }}>― または、マクロで出力したJSONを貼り付け ―</div>

        <textarea
          value={text} onChange={(e) => setText(e.target.value)}
          placeholder='[ { "氏名": "山田 太郎", "店舗": "川崎", ... }, ... ]'
          style={{ ...inputStyle, height: 120, fontFamily: 'monospace', fontSize: 12, resize: 'vertical' }}
        />
        {error && <div style={{ color: C.seal, fontSize: 12, marginTop: 8 }}>{error}</div>}
        {preview && (
          <div style={{ marginTop: 10, fontSize: 12, color: C.seal, background: 'rgba(168,52,43,0.08)', borderRadius: 5, padding: '8px 10px' }}>
            {preview.length} 名分のデータを読み取りました。「インポートを確定」を押すと、現在の台帳データは全て消去され、この{preview.length}名のデータに入れ替わります。
          </div>
        )}
        <div style={{ display: 'flex', gap: 8, marginTop: 14 }}>
          <button onClick={runParse} style={{ padding: '9px 16px', background: '#fff', color: C.ink, border: `1px solid ${C.ink}`, borderRadius: 5, fontSize: 13, cursor: 'pointer' }}>貼り付けたJSONを解析</button>
          <button
            disabled={!preview}
            onClick={() => onImport(preview)}
            style={{ padding: '9px 16px', background: preview ? C.ink : C.line, color: '#fff', border: 'none', borderRadius: 5, fontSize: 13, cursor: preview ? 'pointer' : 'not-allowed' }}
          >インポートを確定</button>
        </div>
      </div>
    </div>
  );
}

            {emp.notes && <div style={{ fontSize: 12, color: C.muted, marginTop: 8, borderTop: `1px solid ${C.line}`, paddingTop: 8, whiteSpace: 'pre-line' }}>{emp.notes}</div>}
          </div>
          <button onClick={() => setEditing(true)} style={{ background: 'none', border: `1px solid ${C.line}`, borderRadius: 5, padding: '6px 10px', cursor: 'pointer', color: C.inkSoft, fontSize: 12, display: 'flex', alignItems: 'center', gap: 4, alignSelf: 'flex-start' }}>
            <Pencil size={13} /> 編集
          </button>
        </div>
      </div>
    );
  }

  return (
    <div style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 6, padding: 24, marginBottom: 18 }}>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
        <Field label="氏名"><input value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} style={inputStyle} /></Field>
        <Field label="店舗"><input value={form.store} onChange={(e) => setForm({ ...form, store: e.target.value })} style={inputStyle} /></Field>
        <Field label="エリア"><input value={form.area} onChange={(e) => setForm({ ...form, area: e.target.value })} style={inputStyle} /></Field>
        <Field label="業態"><input value={form.businessType} onChange={(e) => setForm({ ...form, businessType: e.target.value })} style={inputStyle} /></Field>
        <Field label="雇用形態">
          <select value={form.employmentType} onChange={(e) => setForm({ ...form, employmentType: e.target.value })} style={inputStyle}>
            {EMPLOYMENT_TYPES.map((t) => (<option key={t} value={t}>{empTypeLabel(t)}</option>))}
          </select>
        </Field>
        <Field label="入社日"><input type="date" value={form.joinDate || ''} onChange={(e) => setForm({ ...form, joinDate: e.target.value })} style={inputStyle} /></Field>
        <Field label="勤務状況">
          <select value={form.workStatus || '通常'} onChange={(e) => setForm({ ...form, workStatus: e.target.value })} style={inputStyle}>
            {WORK_STATUS_OPTIONS.map((t) => (<option key={t} value={t}>{t}</option>))}
          </select>
        </Field>
        {form.workStatus === '退職' && (
          <Field label="退職日"><input type="date" value={form.resignDate || ''} onChange={(e) => setForm({ ...form, resignDate: e.target.value })} style={inputStyle} /></Field>
        )}
        <Field label="アラート"><input value={form.alert} onChange={(e) => setForm({ ...form, alert: e.target.value })} style={inputStyle} /></Field>
      </div>
      <Field label="備考"><textarea value={form.notes} onChange={(e) => setForm({ ...form, notes: e.target.value })} style={{ ...inputStyle, height: 60, resize: 'vertical' }} /></Field>
      <div style={{ display: 'flex', gap: 8 }}>
        <button onClick={() => { onUpdateProfile(form); setEditing(false); }} style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '8px 16px', background: C.ink, color: '#fff', border: 'none', borderRadius: 5, fontSize: 13, cursor: 'pointer' }}>
          <Check size={14} /> 保存
        </button>
        <button onClick={() => { setForm(emp); setEditing(false); }} style={{ padding: '8px 16px', background: 'none', border: `1px solid ${C.line}`, borderRadius: 5, fontSize: 13, cursor: 'pointer', color: C.muted }}>キャンセル</button>
      </div>
    </div>
  );
}

function DetailView({ emp, onBack, onRecordMove, onUpdateProfile }) {
  const [newGrade, setNewGrade] = useState(emp.grade || '一般D');
  const [newStore, setNewStore] = useState(emp.store || '');
  const [date, setDate] = useState(todayStr());
  const [reason, setReason] = useState('');

  useEffect(() => { setNewGrade(emp.grade || '一般D'); setNewStore(emp.store || ''); }, [emp.id]);

  const roleChanged = newGrade !== emp.grade;
  const storeChanged = newStore.trim() !== (emp.store || '');
  const canSubmit = roleChanged || storeChanged;
  const historyDesc = buildFullTimeline(emp).reverse();

  const submit = () => {
    onRecordMove({
      fromGrade: emp.grade, toGrade: newGrade,
      fromStore: storeChanged ? (emp.store || '') : undefined,
      toStore: storeChanged ? newStore.trim() : undefined,
      date, reason,
    });
    setReason('');
  };

  return (
    <div>
      <button onClick={onBack} style={{ display: 'flex', alignItems: 'center', gap: 4, background: 'none', border: 'none', color: C.inkSoft, fontSize: 13, cursor: 'pointer', marginBottom: 14, padding: 0 }}>
        <ChevronLeft size={16} /> 台帳一覧に戻る
      </button>

      <ProfileCard emp={emp} onUpdateProfile={onUpdateProfile} />

      <div style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 6, padding: 20, marginBottom: 22 }}>
        <div className="gl-mincho" style={{ fontSize: 14, fontWeight: 700, color: C.ink, marginBottom: 14 }}>昇降格を記録</div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, marginBottom: 12 }}>
          <Field label="新しい役職"><GradeSelect value={newGrade} onChange={setNewGrade} /></Field>
          <Field label="発令日"><input type="date" value={date} onChange={(e) => setDate(e.target.value)} style={{ ...inputStyle, height: 36, boxSizing: 'border-box' }} /></Field>
        </div>
        <Field label="異動先店舗（変更する場合のみ）"><input value={newStore} onChange={(e) => setNewStore(e.target.value)} style={inputStyle} placeholder={emp.store || '店舗名'} /></Field>
        <Field label="理由・所見"><input value={reason} onChange={(e) => setReason(e.target.value)} style={inputStyle} placeholder="人事考課による昇格 など" /></Field>
        <button disabled={!canSubmit} onClick={submit} style={{ padding: '9px 18px', background: canSubmit ? C.ink : C.line, color: '#fff', border: 'none', borderRadius: 5, fontSize: 13, cursor: canSubmit ? 'pointer' : 'not-allowed' }}>記録する</button>
        {!canSubmit && <span style={{ fontSize: 12, color: C.muted, marginLeft: 10 }}>役職または店舗を変更してください</span>}
      </div>

      <div className="gl-mincho" style={{ fontSize: 14, fontWeight: 700, color: C.ink, marginBottom: 12 }}>昇降格履歴（新しい順）</div>
      {historyDesc.length === 0 ? (
        <div style={{ fontSize: 13, color: C.muted }}>まだ評価記録がありません。</div>
      ) : (
        <div style={{ position: 'relative', paddingLeft: 4 }}>
          <div style={{ position: 'absolute', left: 20, top: 8, bottom: 8, width: 1, background: C.line }} />
          {historyDesc.map((h) => {
            const roleChangedEntry = h.fromGrade !== h.toGrade;
            const storeChangedEntry = h.toStore != null;
            return (
              <div key={h.id} style={{ display: 'flex', gap: 14, marginBottom: 18, position: 'relative', opacity: h.synthetic ? 0.55 : 1 }}>
                <div style={{ zIndex: 1 }}><Seal code={h.toGrade} size={h.synthetic ? 32 : 40} /></div>
                <div style={{ background: C.card, border: `1px ${h.synthetic ? 'dashed' : 'solid'} ${C.line}`, borderRadius: 6, padding: '10px 14px', flex: 1 }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 4, flexWrap: 'wrap' }}>
                    <MoveIcon from={h.fromGrade} to={h.toGrade} rename={h.rename} />
                    <span style={{ fontSize: 13, color: h.synthetic ? C.muted : C.ink, fontWeight: h.synthetic ? 400 : 500 }}>
                      {h.dataStart
                        ? `${gradeLabel(h.toGrade)}（データ記録開始時点）`
                        : h.synthetic
                        ? `${gradeLabel(h.toGrade)}（変動なし・停滞）`
                        : h.rename
                        ? `${gradeLabel(h.fromGrade)} → ${gradeLabel(h.toGrade)}（名称変更）`
                        : h.fromGrade ? `${gradeLabel(h.fromGrade)} → ${gradeLabel(h.toGrade)}` : `${gradeLabel(h.toGrade)}（初回配属）`}
                    </span>
                    <span style={{ fontSize: 12, color: C.muted, marginLeft: 'auto' }}>{h.date}</span>
                  </div>
                  {storeChangedEntry && (
                    <div style={{ fontSize: 12, color: C.inkSoft, marginBottom: 2 }}>店舗異動：{h.fromStore || '—'} → {h.toStore}</div>
                  )}
                  {h.reason && <div style={{ fontSize: 12, color: C.inkSoft }}>{h.reason}{h.quarterLabel ? `（${h.quarterLabel}）` : ''}</div>}
                  {h.synthetic && h.quarterLabel && <div style={{ fontSize: 11, color: C.muted }}>{h.quarterLabel}</div>}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<GradeLedger />);

</script>
</body>
</html>
